image: mcr.microsoft.com/playwright:v1.50.0-noble

definitions:
  caches:
    npm: ~/.npm

pipelines:
  default:
    - step:
        name: Install Dependencies
        caches:
          - npm
        script:
          - npm ci

    - step:
        name: Run Visual Tests
        script:
          - BASE_URL=https://stage.livguardsolar.com/ npx playwright test tests/visual/
        artifacts:
          - reports/html/**
          - reports/junit/**
          - allure-results/**
          - test-results/**
