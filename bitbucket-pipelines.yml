image: mcr.microsoft.com/playwright:v1.50.0-jammy

definitions:
  caches:
    npm: ~/.npm
  steps:
    - step: &lighthouse-ci
        name: Lighthouse CI
        size: 2x
        script:
          - npm install -g @lhci/cli@0.15.1
          - wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor > /usr/share/keyrings/google-chrome.gpg
          - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
          - apt-get update -qq && apt-get install -y google-chrome-stable
          - export CHROME_PATH=$(which google-chrome-stable)
          - echo "Chrome found at $CHROME_PATH"
          - lhci autorun
          - node scripts/lighthouse-slack-report.js
        artifacts:
          - .lighthouseci/**
    - step: &visual-regression
        name: Visual Regression
        size: 2x
        caches:
          - npm
        script:
          - npm ci
          - ./node_modules/.bin/playwright install chromium webkit
          - |
            CI=1 BASE_URL=https://stage.livguardsolar.com/ \
            ./node_modules/.bin/playwright test \
              tests/visual/rooftop-solar.visual.spec.ts \
              tests/visual/solar-for-home.visual.spec.ts \
              tests/visual/solar-for-commercial.visual.spec.ts \
              tests/visual/homepage.visual.spec.ts \
              --project=chromium-desktop \
              --project=mobile-chrome \
              --project=mobile-safari \
              --workers=100% \
              --retries=2
          - npx ts-node brain/analyze.ts
        artifacts:
          - reports/**
          - test-results/**
    - step: &visual-slack
        name: Visual Regression Slack Report
        script:
          - node scripts/visual-slack-report.js
    - step: &design-to-code
        name: Design-to-Code Validation
        size: 2x
        caches:
          - npm
        script:
          - npm ci
          - ./node_modules/.bin/playwright install chromium
          - npx ts-node tests/linear/design-to-code-validation.spec.ts

pipelines:
  default:
    - parallel:
      - step: *lighthouse-ci
      - step: *visual-regression
    - step: *visual-slack

  branches:
    'ui/**':
      - parallel:
        - step: *lighthouse-ci
        - step: *visual-regression
        - step: *design-to-code
      - step: *visual-slack
    'design/**':
      - parallel:
        - step: *lighthouse-ci
        - step: *visual-regression
        - step: *design-to-code
      - step: *visual-slack

  custom:
    master-update:
      - variables:
          - name: SPEC
            default: solar-for-commercial
            allowed-values:
              - rooftop-solar
              - homepage
              - solar-for-home
              - solar-for-commercial
      - step:
          name: "Master Update: Re-record HAR + Re-snap baselines"
          size: 4x
          caches:
            - npm
          script:
            - npm ci
            - ./node_modules/.bin/playwright install chromium webkit
            - |
              PROJECTS="--project=chromium-desktop --project=mobile-chrome --project=mobile-safari"
              echo "==> Step 1/2: Re-snapping baselines for $SPEC..."
              set +e
              BASE_URL=https://stage.livguardsolar.com/ \
              ./node_modules/.bin/playwright test \
                "tests/visual/${SPEC}.visual.spec.ts" \
                $PROJECTS \
                --workers=100% \
                --retries=0 \
                --update-snapshots
              set -e
              echo "Snapshot update complete."
            - |
              echo "==> Step 2/2: Committing updated snapshots..."
              git config user.email "ci-pipeline@livguardsolar.com"
              git config user.name "Bitbucket CI [master-update]"
              printf 'machine bitbucket.org\nlogin %s\npassword %s\n' "${BB_USER}" "${BB_APP_PASSWORD}" > ~/.netrc
              chmod 600 ~/.netrc
              git add tests/visual/__snapshots__/
              if git diff --cached --quiet; then
                echo "No changes detected — snapshots are already up to date."
              else
                git commit -m "chore(ci): master-update ${SPEC} — refresh snapshots [skip ci]"
                git push origin HEAD:master
                echo "Done. Pushed updated snapshots to master."
              fi
          artifacts:
            - tests/fixtures/har/**
            - tests/visual/__snapshots__/**
            - reports/**
    visual-smoke:
      - variables:
          - name: SPEC
            default: homepage
            allowed-values:
              - homepage
              - rooftop-solar
              - solar-for-home
              - solar-for-commercial
          - name: PROJECT
            default: chromium-desktop
            allowed-values:
              - chromium-desktop
              - mobile-chrome
              - mobile-safari
      - step:
          name: "Visual Smoke: 1 spec × 1 project"
          size: 2x
          caches:
            - npm
          script:
            - npm ci
            - ./node_modules/.bin/playwright install chromium webkit
            - |
              CI=1 BASE_URL=https://stage.livguardsolar.com/ \
              ./node_modules/.bin/playwright test \
                "tests/visual/${SPEC}.visual.spec.ts" \
                --project=${PROJECT} \
                --workers=100% \
                --retries=1
          artifacts:
            - reports/**
            - test-results/**
    load-test:
      - step:
          name: k6 Load Test
          image: grafana/k6:latest
          script:
            - k6 run --env STAGING_URL=$STAGING_URL --env K6_BYPASS_TOKEN=$K6_BYPASS_TOKEN --summary-export=k6-summary.json tests/performance/load.k6.js
          artifacts:
            - k6-summary.json
      - step:
          name: k6 Slack Report
          script:
            - node scripts/k6-slack-report.js
