    - step:
        name: Visual Tests (solar-for-commercial)
        size: 4x
        caches:
          - npm
        script:
          - npm ci
          - ./node_modules/.bin/playwright install chromium webkit
          - >-
            bash -c 'set +e;
            ./node_modules/.bin/playwright test
            tests/visual/solar-for-commercial.visual.spec.ts
            --project=chromium-desktop
            --project=mobile-chrome
            --project=mobile-safari
            --workers=100%;
            PW_EXIT=$?;
            npx ts-node brain/analyze.ts || true;
            exit $PW_EXIT'
        artifacts:
          - reports/**
          - allure-results/**
          - tests/visual/__snapshots__/**

  custom:
    master-update:
      - variables:
          - name: SPEC
            default: solar-for-commercial
            allowed-values:
              - rooftop-solar
              - homepage
              - solar-for-home
              - solar-for-commercial
      - step:
          name: "Master Update: Re-record HAR + Re-snap baselines"
          size: 4x
          caches:
            - npm
          script:
            - npm ci
            - |
              if [ "$SPEC" = "solar-for-commercial" ] || [ "$SPEC" = "solar-for-home" ]; then
                ./node_modules/.bin/playwright install chromium webkit
              else
                ./node_modules/.bin/playwright install chromium
              fi
            - |
              case "$SPEC" in
                rooftop-solar)        HAR_SCRIPT="scripts/record-har-rooftop-solar.ts" ;;
                homepage)             HAR_SCRIPT="scripts/record-har-homepage.ts" ;;
                solar-for-home)       HAR_SCRIPT="scripts/record-har-solar-for-home.ts" ;;
                solar-for-commercial) HAR_SCRIPT="scripts/record-har-solar-for-commercial.ts" ;;
              esac
              echo "==> Step 1/3: Re-recording HAR for $SPEC..."
              BASE_URL=https://stage.livguardsolar.com/ npx ts-node "$HAR_SCRIPT"
            - |
              case "$SPEC" in
                solar-for-commercial|solar-for-home)
                  PROJECTS="--project=chromium-desktop --project=mobile-chrome --project=mobile-safari"
                  ;;
                *)
                  PROJECTS="--project=chromium-desktop"
                  ;;
              esac
              echo "==> Step 2/3: Re-snapping baselines for $SPEC..."
              set +e
              BASE_URL=https://stage.livguardsolar.com/ \
              ./node_modules/.bin/playwright test \
                "tests/visual/${SPEC}.visual.spec.ts" \
                $PROJECTS \
                --workers=100% \
                --retries=0 \
                --update-snapshots
              set -e
              echo "Snapshot update complete."
            - |
              echo "==> Step 3/3: Committing updated HAR + snapshots..."
              git config user.email "ci-pipeline@livguardsolar.com"
              git config user.name "Bitbucket CI [master-update]"
              git remote set-url origin "https://${BB_USER}:${BB_APP_PASSWORD}@bitbucket.org/${BITBUCKET_REPO_FULL_NAME}.git"
              git add tests/fixtures/har/ tests/visual/__snapshots__/
              if git diff --cached --quiet; then
                echo "No changes detected — HAR and snapshots are already up to date."
              else
                git commit -m "chore(ci): master-update ${SPEC} — refresh HAR + snapshots [skip ci]"
                git push origin HEAD:master
                echo "Done. Pushed updated files to master."
              fi
          artifacts:
            - tests/fixtures/har/**
            - tests/visual/__snapshots__/**
            - reports/**
