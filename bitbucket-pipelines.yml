    - step:
        name: Visual Tests (solar-for-commercial)
        size: 4x
        caches:
          - npm
        script:
          - npm ci
          - ./node_modules/.bin/playwright install chromium webkit
          - >-
            bash -c 'set +e;
            ./node_modules/.bin/playwright test
            tests/visual/solar-for-commercial.visual.spec.ts
            --project=chromium-desktop
            --project=mobile-chrome
            --project=mobile-safari
            --workers=100%;
            PW_EXIT=$?;
            npx ts-node brain/analyze.ts || true;
            exit $PW_EXIT'
        artifacts:
          - reports/**
          - allure-results/**
          - tests/visual/__snapshots__/**
    - step:
        name: Linear Design Validation
        # Runs the design-to-code validation script unconditionally.
        # The script handles skip logic internally:
        #   - Exits 0 with a skip message if BITBUCKET_BRANCH contains no Linear ticket ID
        #   - Exits 0 with a skip message if BITBUCKET_BRANCH is unset
        #   - Exits 0 (PASS) if isUpdated=true
        #   - Exits 1 (FAIL) if isUpdated=false
        #
        # Required Bitbucket repository variables (Settings -> Repository variables):
        #   LINEAR_API_KEY  — Linear personal API key or OAuth token
        #   GEMINI_API_KEY  — Google Gemini API key (free tier, gemini-1.5-flash)
        #   STAGING_URL     — Staging base URL (e.g. https://stage.livguardsolar.com)
        #   Verify path is taken from the ticket description: "Verify: /solar-for-home"
        size: 2x
        caches:
          - npm
        script:
          - npm ci
          - ./node_modules/.bin/playwright install chromium
          - >-
            LINEAR_API_KEY=$LINEAR_API_KEY
            GEMINI_API_KEY=$GEMINI_API_KEY
            STAGING_URL=$STAGING_URL
            npx ts-node tests/linear/design-to-code-validation.spec.ts

  custom:
    master-update:
      - variables:
          - name: SPEC
            default: solar-for-commercial
            allowed-values:
              - rooftop-solar
              - homepage
              - solar-for-home
              - solar-for-commercial
      - step:
          name: "Master Update: Re-record HAR + Re-snap baselines"
          size: 4x
          caches:
            - npm
          script:
            - npm ci
            - |
              if [ "$SPEC" = "solar-for-commercial" ] || [ "$SPEC" = "solar-for-home" ] || [ "$SPEC" = "homepage" ]; then
                ./node_modules/.bin/playwright install chromium webkit
              else
                ./node_modules/.bin/playwright install chromium
              fi
            - |
              if [ "$SPEC" = "homepage" ]; then
                echo "==> Step 1/3: Skipping HAR re-record for homepage."
                echo "    cdndev.livguardsolar.com is WAF-blocked from Bitbucket runners."
                echo "    Record locally: npm run test:record-har:homepage  then commit the HAR."
              else
                case "$SPEC" in
                  rooftop-solar)        HAR_SCRIPT="scripts/record-har-rooftop-solar.ts" ;;
                  solar-for-home)       HAR_SCRIPT="scripts/record-har-solar-for-home.ts" ;;
                  solar-for-commercial) HAR_SCRIPT="scripts/record-har-solar-for-commercial.ts" ;;
                esac
                echo "==> Step 1/3: Re-recording HAR for $SPEC..."
                BASE_URL=https://stage.livguardsolar.com/ npx ts-node "$HAR_SCRIPT"
              fi
            - |
              case "$SPEC" in
                solar-for-commercial|solar-for-home|homepage)
                  PROJECTS="--project=chromium-desktop --project=mobile-chrome --project=mobile-safari"
                  ;;
                *)
                  PROJECTS="--project=chromium-desktop"
                  ;;
              esac
              echo "==> Step 2/3: Re-snapping baselines for $SPEC..."
              set +e
              BASE_URL=https://stage.livguardsolar.com/ \
              ./node_modules/.bin/playwright test \
                "tests/visual/${SPEC}.visual.spec.ts" \
                $PROJECTS \
                --workers=100% \
                --retries=0 \
                --update-snapshots
              set -e
              echo "Snapshot update complete."
            - |
              echo "==> Step 3/3: Committing updated HAR + snapshots..."
              git config user.email "ci-pipeline@livguardsolar.com"
              git config user.name "Bitbucket CI [master-update]"
              printf 'machine bitbucket.org\nlogin %s\npassword %s\n' "${BB_USER}" "${BB_APP_PASSWORD}" > ~/.netrc
              chmod 600 ~/.netrc
              git add tests/fixtures/har/ tests/visual/__snapshots__/
              if git diff --cached --quiet; then
                echo "No changes detected — HAR and snapshots are already up to date."
              else
                git commit -m "chore(ci): master-update ${SPEC} — refresh HAR + snapshots [skip ci]"
                git push origin HEAD:master
                echo "Done. Pushed updated files to master."
              fi
          artifacts:
            - tests/fixtures/har/**
            - tests/visual/__snapshots__/**
            - reports/**
