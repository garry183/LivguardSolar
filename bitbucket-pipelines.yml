image: mcr.microsoft.com/playwright:v1.50.0-noble

definitions:
  caches:
    npm: ~/.npm

pipelines:
  default:
    - step:
        name: Install and Run Visual Tests (noida)
        caches:
          - npm
        script:
          - npm ci
          - ./node_modules/.bin/playwright install --with-deps
          - BASE_URL=https://stage.livguardsolar.com/ ./node_modules/.bin/playwright test tests/visual/rooftop-solar-noida.visual.spec.ts --project=chromium-desktop
        artifacts:
          - reports/html/**
          - reports/junit/**
          - allure-results/**
          - reports/test-results/**
